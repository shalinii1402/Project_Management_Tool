<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ProjectFlow</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-page">

    <div class="auth-card fade-in">
        <div class="text-center" style="margin-bottom: 30px;">
            <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 10px;">
                <i class="fas fa-layer-group"></i> ProjectFlow
            </a>
            <h2>Welcome Back</h2>
            <p>Log in to your account</p>
        </div>

        <form class="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@company.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <i class="fas fa-eye toggle-password"></i>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 0.9rem;">
                <label style="display: flex; align-items: center; gap: 5px; font-weight: normal;">
                    <input type="checkbox" style="width: auto;"> Remember me
                </label>
                <a href="#" style="color: var(--primary-color);">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Log In</button>

            <div class="social-separator">OR continue with</div>

            <div class="social-login-group">
                <a href="#" class="social-btn google" title="Google"><i class="fab fa-google"></i></a>
                <a href="#" class="social-btn facebook" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            </div>

            <div class="text-center" style="margin-top: 20px;">
                <p>Don't have an account? <a href="signup.html" style="color: var(--primary-color);">Sign up</a></p>
            </div>
        </form>
    </div>

    <script src="assets/js/script.js"></script>
</body>

</html>
