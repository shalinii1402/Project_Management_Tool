<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - ProjectFlow</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-page">

    <div class="auth-card fade-in">
        <div class="text-center" style="margin-bottom: 30px;">
            <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 10px;">
                <i class="fas fa-layer-group"></i> ProjectFlow
            </a>
            <h2>Get Started</h2>
            <p>Create your free account</p>
        </div>

        <form class="auth-form">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@company.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <i class="fas fa-eye toggle-password"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="checkbox-group">
                    <input type="checkbox" id="terms-checkbox" checked>
                    <span>I have accepted the <a href="#" style="color: var(--primary-color);">Terms &
                            Conditions</a></span>
                </label>
            </div>

            <button type="submit" id="signup-btn" class="btn btn-primary" style="width: 100%;">Create Account</button>

            <div class="social-separator">OR continue with</div>

            <div class="social-login-group">
                <a href="#" class="social-btn google" title="Google"><i class="fab fa-google"></i></a>
                <a href="#" class="social-btn facebook" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            </div>

            <div class="text-center" style="margin-top: 20px;">
                <p>Already have an account? <a href="login.html" style="color: var(--primary-color);">Log in</a></p>
            </div>
        </form>
    </div>

    <script src="assets/js/script.js"></script>
</body>

</html>
